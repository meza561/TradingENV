# Copy to options.yaml (gitignored) and edit.
mode: paper                 # live ALSO requires LIVE_ENABLED and removing the deny rule
account_number: "REPLACE_ME"
underlyings: [TLT, XLU, XLF]   # trimmed 2026-09-23: see below

# sizing: floor, fraction of account value, ceiling
min_position_usd: 50
max_position_usd: 100
position_fraction: 0.33
max_open_positions: 2
max_lifetime_usd: 2000      # dead-man's switch on cumulative deployment

# exits -- deterministic, never delegated
take_profit_pct: 50
stop_loss_pct: 50
close_at_dte: 14

# entry filters
min_dte: 30
max_dte: 45
target_delta: 0.30
delta_tolerance: 0.15
max_spread_pct_of_mid: 12   # calibrated 2026-09-23 from live mid-session quotes
min_open_interest: 100

structure_ttl_days: 5       # strikes/expirations barely move
cadence_minutes: 30
open_buffer_minutes: 15
close_buffer_minutes: 10
paper_start_usd: 150
ledger_dir: .
